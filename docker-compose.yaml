name: ips
services:
  client:
    build:
      context: ./services/client
      dockerfile: Dockerfile
    ports:
      - 80:80
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_AVATAR_URL: ${VITE_AVATAR_URL}
    depends_on:
      - convert
      - signal

  convert:
    build:
      context: ./services/convert
      dockerfile: Dockerfile
    env_file:
      - .env

  signal:
    build:
      context: ./services/signal
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis
    ports:
      - 6379:6379

  turn:
    build:
      context: ./services/turn
    env_file:
      - .env
    ports:
      - '${TURN_PORT:-3478}:${TURN_PORT:-3478}'
      - '${TURN_PORT:-3478}:${TURN_PORT:-3478}/udp'
    restart: unless-stopped
